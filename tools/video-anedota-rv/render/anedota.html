<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;background:#fbfaf7;overflow:hidden;font-family:'Kalam',cursive;}
.stage{position:relative;width:1920px;height:1080px;
  background-image:radial-gradient(rgba(14,74,87,.06) 2px, transparent 2px);background-size:44px 44px;}
.frame{position:absolute;inset:26px;border:3px solid #0E4A57;border-radius:10px;opacity:.10;}
.brand{position:absolute;top:48px;left:0;right:0;text-align:center;font-family:'Caveat',cursive;
  font-weight:700;font-size:40px;color:#0E4A57;opacity:.92;}
.brand small{display:block;font-family:'Kalam',cursive;font-weight:400;font-size:15px;
  letter-spacing:.28em;text-transform:uppercase;color:#9a8f80;margin-top:-2px;}
svg{position:absolute;inset:0;width:1920px;height:1080px;}
.ink{fill:none;stroke:#0E4A57;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;}
.ink.accent{stroke:#E27A2E;}
.ink.red{stroke:#C0392B;}
.decor-ink{fill:none;stroke:#E27A2E;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.34;}
.decor-ink.blue{stroke:#0E4A57;opacity:.24;}
.lbl{font-family:'Caveat',cursive;font-weight:700;fill:#0E4A57;opacity:0;}
.lbl.accent{fill:#E27A2E;}
#pen{opacity:0;}
#pen path{fill:#0E4A57;stroke:none;}
#pen .nib{fill:#E27A2E;}
.cap{position:absolute;left:0;right:0;top:720px;text-align:center;
  font-family:'Caveat',cursive;font-weight:700;color:#0E4A57;font-size:58px;line-height:1.14;opacity:0;padding:0 200px;}
.closing-name{font-family:'Caveat',cursive;font-weight:700;font-size:86px;}
.closing-sub{font-family:'Kalam',cursive;font-weight:400;font-size:28px;color:#5a6a7a;margin-top:2px;}
</style>
</head>
<body>
<div class="stage">
  <div class="frame"></div>
  <div class="brand">Uma história que eu vivi<small>Priscila Palomo · Psicóloga · CRP 98007</small></div>
  <svg id="art" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
    <g id="decor"></g>
    <g id="scenes"></g>
    <g id="pen">
      <path class="nib" d="M0 0 L11 -7 L18 -12 L11 -19 L-6 4 Z"></path>
      <path d="M11 -19 L44 -60 C48 -65 58 -55 53 -50 L18 -12 Z"></path>
      <path d="M44 -60 L58 -74 C64 -80 74 -70 68 -64 L53 -50 Z"></path>
    </g>
  </svg>
  <div class="cap" id="cap"></div>
</div>

<script>
const n=(v)=>Math.round(v*10)/10;
function heart(cx,cy,s,c){return [{d:`M${cx} ${cy+34*s} C${cx-34*s} ${cy+6*s} ${cx-42*s} ${cy-26*s} ${cx-16*s} ${cy-30*s} C${cx-5*s} ${cy-32*s} ${cx} ${cy-22*s} ${cx} ${cy-15*s} C${cx} ${cy-22*s} ${cx+5*s} ${cy-32*s} ${cx+16*s} ${cy-30*s} C${cx+42*s} ${cy-26*s} ${cx+34*s} ${cy+6*s} ${cx} ${cy+34*s} Z`, c:c||'red'}];}
function person(cx,cy,s,c){const h=cy-92*s; return [
  {d:`M${cx} ${h} m${-26*s} 0 a${26*s} ${26*s} 0 1 0 ${52*s} 0 a${26*s} ${26*s} 0 1 0 ${-52*s} 0`, c},
  {d:`M${cx} ${cy-40*s} L${cx} ${cy+22*s}`, c},
  {d:`M${cx-32*s} ${cy-14*s} L${cx} ${cy-34*s} L${cx+32*s} ${cy-14*s}`, c},
  {d:`M${cx} ${cy+22*s} L${cx-22*s} ${cy+66*s}`, c},
  {d:`M${cx} ${cy+22*s} L${cx+22*s} ${cy+66*s}`, c}
];}
function vrHead(cx,cy,s,c){ // cabeça com capacete de RV
  return [
  {d:`M${cx} ${cy} m${-30*s} 0 a${30*s} ${30*s} 0 1 0 ${60*s} 0 a${30*s} ${30*s} 0 1 0 ${-60*s} 0`, c},
  {d:`M${cx-40*s} ${cy-10*s} L${cx+40*s} ${cy-10*s} C${cx+52*s} ${cy-10*s} ${cx+52*s} ${cy+22*s} ${cx+40*s} ${cy+22*s} L${cx-40*s} ${cy+22*s} C${cx-52*s} ${cy+22*s} ${cx-52*s} ${cy-10*s} ${cx-40*s} ${cy-10*s} Z`, c:'accent'},
  {d:`M${cx} ${cy-10*s} L${cx} ${cy+22*s}`, c:'accent'},
  {d:`M${cx-40*s} ${cy+4*s} C${cx-64*s} ${cy-8*s} ${cx-64*s} ${cy-30*s} ${cx-40*s} ${cy-36*s}`, c:'accent'}
];}
function vrTable(cx,cy,s,c){ // capacete de RV sobre uma mesinha
  return [
  {d:`M${cx-44*s} ${cy-6*s} L${cx+44*s} ${cy-6*s} C${cx+58*s} ${cy-6*s} ${cx+58*s} ${cy+30*s} ${cx+44*s} ${cy+30*s} L${cx-44*s} ${cy+30*s} C${cx-58*s} ${cy+30*s} ${cx-58*s} ${cy-6*s} ${cx-44*s} ${cy-6*s} Z`, c:'accent'},
  {d:`M${cx} ${cy-6*s} L${cx} ${cy+30*s}`, c:'accent'},
  {d:`M${cx-70*s} ${cy+44*s} L${cx+70*s} ${cy+44*s}`, c},
  {d:`M${cx-54*s} ${cy+44*s} L${cx-54*s} ${cy+84*s} M${cx+54*s} ${cy+44*s} L${cx+54*s} ${cy+84*s}`, c}
];}
function building(cx,baseY,w,h,c){
  const x=cx-w/2, y=baseY-h; const paths=[{d:`M${x} ${baseY} L${x} ${y} L${x+w} ${y} L${x+w} ${baseY}`, c}];
  const rows=Math.min(6, Math.floor(h/70));
  for(let r=0;r<rows;r++){ const wy=y+22+r*66;
    paths.push({d:`M${x+16} ${wy} h${w*0.28} v22 h${-w*0.28} z`, c:'accent'});
    paths.push({d:`M${x+w-16-w*0.28} ${wy} h${w*0.28} v22 h${-w*0.28} z`, c:'accent'});
  }
  return paths;
}
function drop(cx,cy,s,c){return [{d:`M${cx} ${cy} q${7*s} ${11*s} 0 ${16*s} q${-7*s} ${-5*s} 0 ${-16*s} Z`, c:c||'accent'}];}
function speech(cx,cy,w,h,c){const x=cx-w/2,y=cy-h/2;return [
  {d:`M${x+16} ${y} L${x+w-16} ${y} Q${x+w} ${y} ${x+w} ${y+16} L${x+w} ${y+h-16} Q${x+w} ${y+h} ${x+w-16} ${y+h} L${x+56} ${y+h} L${x+30} ${y+h+30} L${x+38} ${y+h} L${x+16} ${y+h} Q${x} ${y+h} ${x} ${y+h-16} L${x} ${y+16} Q${x} ${y} ${x+16} ${y} Z`, c},
  {d:`M${x+w*0.30} ${y+h*0.5} l0 0`, c},
  {d:`M${x+w*0.30} ${y+h*0.5} m-5 0 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0`, c:'accent'},
  {d:`M${x+w*0.50} ${y+h*0.5} m-5 0 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0`, c:'accent'},
  {d:`M${x+w*0.70} ${y+h*0.5} m-5 0 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0`, c:'accent'}
];}
function brain(cx,cy,c){return [
  {d:`M${cx-10} ${cy-30} C${cx-40} ${cy-40} ${cx-46} ${cy} ${cx-20} ${cy+6} C${cx-40} ${cy+22} ${cx-14} ${cy+48} ${cx+2} ${cy+38} C${cx+16} ${cy+52} ${cx+44} ${cy+34} ${cx+30} ${cy+12} C${cx+52} ${cy} ${cx+40} ${cy-36} ${cx+12} ${cy-30} C${cx+6} ${cy-44} ${cx-6} ${cy-42} ${cx-10} ${cy-30} Z`, c},
  {d:`M${cx} ${cy-30} L${cx} ${cy+38}`, c}
];}
function sparkle(cx,cy,s,c){return [{d:`M${cx} ${cy-10*s} L${cx} ${cy+10*s} M${cx-10*s} ${cy} L${cx+10*s} ${cy} M${cx-6*s} ${cy-6*s} L${cx+6*s} ${cy+6*s} M${cx-6*s} ${cy+6*s} L${cx+6*s} ${cy-6*s}`, c:c||'accent'}];}
function swirl(cx,cy,s,c){return [{d:`M${cx} ${cy} q${14*s} ${-14*s} ${28*s} 0 q${16*s} ${16*s} ${-6*s} ${26*s}`, c:c||'accent'}];}
function star(cx,cy,s,c){const pts=[];for(let i=0;i<10;i++){const r=(i%2?0.42:1)*s;const a=-Math.PI/2+i*Math.PI/5;pts.push(`${n(cx+r*Math.cos(a))} ${n(cy+r*Math.sin(a))}`);}return [{d:`M${pts.join(' L')} Z`, c:c||'accent'}];}

const CX=960, CY=420;
const SCENES = [
  { cap:"Deixa eu te contar uma\nhistória da minha vida.", paths:[
      ...speech(CX,CY-20,360,150) ],
    labels:[] },

  { cap:"Meu primeiro dia no laboratório\nde realidade virtual, em Valência.", paths:[
      ...building(720,CY+150,150,300), ...vrTable(1180,CY+40,1.4) ],
    labels:[{x:1180,y:CY+180,t:"Valência",s:30,c:'accent'}] },

  { cap:"Me deram um capacete enorme\ne disseram: 'pode colocar'.", paths:[
      ...person(CX,CY+40,1.15), ...vrHead(CX,CY-56,1.3) ],
    labels:[] },

  { cap:"De repente, eu estava no topo\nde um prédio altíssimo!", paths:[
      ...building(CX,CY+230,150,330),
      ...person(CX,CY-120,0.62),
      ...heart(CX+120,CY-150,0.7,'red'),
      ...drop(CX-70,CY-150,1.4), ...drop(CX+60,CY-90,1.2) ],
    labels:[] },

  { cap:"Mas eu estava segura, paradinha,\nnuma salinha na Espanha.", paths:[
      {d:`M700 ${CY+180} L1220 ${CY+180} L1220 ${CY-150} L700 ${CY-150} Z`},
      ...person(960,CY+70,1.1), ...vrHead(960,CY-30,1.2),
      ...sparkle(1150,CY-110,1.3) ],
    labels:[] },

  { cap:"Ali eu entendi: se o cérebro aprende\na temer, também reaprende a coragem.", paths:[
      ...brain(CX-70,CY-10), ...heart(CX+90,CY,1.1,'red'),
      {d:`M${CX-10} ${CY-10} L${CX+40} ${CY-10}`, c:'accent'},
      {d:`M${CX+30} ${CY-20} L${CX+42} ${CY-10} L${CX+30} ${CY}`, c:'accent'} ],
    labels:[] },

  { cap:"", closing:true, paths:[ {d:`M${CX} 402 m-146 0 a146 146 0 1 0 292 0 a146 146 0 1 0 -292 0`}, ...star(CX-190,300,26), ...star(CX+190,300,22) ] }
];

/* ================= floreados fixos ================= */
const NS='http://www.w3.org/2000/svg';
(function(){
  const decorG=document.getElementById('decor');
  const deco=[].concat(
    sparkle(150,160,1.6), swirl(120,220,1.4),
    sparkle(1780,160,1.5), swirl(1720,215,1.3),
    sparkle(150,930,1.4), sparkle(1785,930,1.4),
    swirl(1720,900,1.2), swirl(120,880,1.2))
    .map((p,i)=>({d:p.d, blue:i%3===0}));
  deco.forEach(p=>{const el=document.createElementNS(NS,'path');el.setAttribute('d',p.d);el.setAttribute('class','decor-ink'+(p.blue?' blue':''));decorG.appendChild(el);});
})();

/* ================= build DOM ================= */
const scenesG=document.getElementById('scenes');
const capEl=document.getElementById('cap');
const penEl=document.getElementById('pen');
function corValida(c){return ['','c-la','c-ou','c-vd'].includes(c)?c:'';}

const built = SCENES.map((sc)=>{
  const g=document.createElementNS(NS,'g'); g.style.opacity='0';
  const paths=sc.paths.map(p=>{const el=document.createElementNS(NS,'path');el.setAttribute('d',p.d);el.setAttribute('class','ink'+(p.c?' '+p.c:''));g.appendChild(el);return el;});
  const labelEls=(sc.labels||[]).map(l=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',l.x);t.setAttribute('y',l.y);t.setAttribute('text-anchor','middle');t.setAttribute('font-size',l.s||30);t.setAttribute('class','lbl'+(l.c?' '+l.c:''));t.textContent=l.t;g.appendChild(t);return t;});
  let imgEl=null,nameG=null;
  if(sc.closing){
    const defs=document.createElementNS(NS,'defs');const cp=document.createElementNS(NS,'clipPath');cp.setAttribute('id','cpp');
    const cc=document.createElementNS(NS,'circle');cc.setAttribute('cx','960');cc.setAttribute('cy','402');cc.setAttribute('r','138');cp.appendChild(cc);defs.appendChild(cp);g.appendChild(defs);
    imgEl=document.createElementNS(NS,'image');imgEl.setAttribute('href','../../../assets/avatar-ilustrado.png');
    imgEl.setAttribute('x','822');imgEl.setAttribute('y','264');imgEl.setAttribute('width','276');imgEl.setAttribute('height','276');
    imgEl.setAttribute('preserveAspectRatio','xMidYMid slice');imgEl.setAttribute('clip-path','url(#cpp)');imgEl.style.opacity='0';g.appendChild(imgEl);
    nameG=document.createElementNS(NS,'foreignObject');nameG.setAttribute('x','360');nameG.setAttribute('y','600');nameG.setAttribute('width','1200');nameG.setAttribute('height','300');
    nameG.innerHTML='<div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;color:#0E4A57;opacity:0" class="ct"><div class="closing-name">É por isso que sou psicóloga de fobias.</div><div class="closing-sub">Priscila Palomo · priscilapalomo.com</div></div>';
    g.appendChild(nameG);
  }
  scenesG.appendChild(g);
  const lens=paths.map(el=>el.getTotalLength());
  paths.forEach((el,k)=>{el.style.strokeDasharray=lens[k];el.style.strokeDashoffset=lens[k];});
  return {g,paths,lens,labelEls,imgEl,nameG,sc};
});

/*DUR_START*/
let SCENE_DURMS = [4952,7304,6680,7712,8528,8864,8840];
/*DUR_END*/

function computeStarts(){const s=[];let a=0;for(let i=0;i<SCENE_DURMS.length;i++){s.push(a);a+=SCENE_DURMS[i];}return {starts:s,total:a};}
let {starts,total}=computeStarts();
window.__totalDuration=total;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

window.__render=function(t){
  ({starts,total}=computeStarts());window.__totalDuration=total;
  t=clamp(t,0,total-1);
  let k=SCENE_DURMS.length-1;
  for(let i=0;i<SCENE_DURMS.length;i++){if(t>=starts[i]&&t<starts[i]+SCENE_DURMS[i]){k=i;break;}}
  const localT=t-starts[k], durK=SCENE_DURMS[k];
  const drawDur=Math.max(1400,durK-950);
  const df=clamp(localT/drawDur,0,1);
  penEl.style.opacity='0';
  built.forEach((b,i)=>{
    if(i!==k){
      b.g.style.opacity='0';
      b.paths.forEach((el,j)=>el.style.strokeDashoffset=(i<k)?0:b.lens[j]);
      b.labelEls.forEach(t=>t.style.opacity='0');
      if(b.imgEl)b.imgEl.style.opacity='0';
      if(b.nameG){const d=b.nameG.querySelector('.ct');if(d)d.style.opacity='0';}
    } else {
      b.g.style.opacity=clamp(localT/160,0,1);
      const nn=b.paths.length, seg=1/nn; let penSet=false;
      for(let j=0;j<nn;j++){
        const pj=clamp((df-j*seg)/seg,0,1);
        b.paths[j].style.strokeDashoffset=b.lens[j]*(1-pj);
        if(!penSet&&pj>0&&pj<1){const pt=b.paths[j].getPointAtLength(b.lens[j]*pj);penEl.setAttribute('transform','translate('+pt.x+','+pt.y+') rotate(6)');penEl.style.opacity='1';penSet=true;}
      }
      const lop=clamp((localT-drawDur*0.55)/450,0,1);
      b.labelEls.forEach(t=>t.style.opacity=lop);
      if(b.imgEl)b.imgEl.style.opacity=clamp((df-0.6)/0.4,0,1);
      if(b.nameG){const d=b.nameG.querySelector('.ct');if(d)d.style.opacity=clamp((localT-800)/500,0,1);}
    }
  });
  const sc=built[k].sc;
  if(sc.cap){
    if(capEl.dataset.k!==String(k)){capEl.innerHTML=sc.cap.split('\n').map(l=>'<div>'+l+'</div>').join('');capEl.dataset.k=String(k);}
    capEl.style.opacity=clamp((localT-250)/450,0,1);
  } else {capEl.style.opacity='0';capEl.dataset.k=String(k);}
};
window.__render(0);
</script>
</body>
</html>
