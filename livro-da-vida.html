<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro da Vida — caderno local — Priscila Palomo</title>
<meta name="description" content="Caderno interno do Livro da Vida: recuperação do site Manus, importação de backup e relatos no navegador.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>P</text></svg>">
<link rel="stylesheet" href="assets/terapia-os.css">
<style>
.wrap-lv{width:min(920px,100%);margin:0 auto;padding:28px 18px 64px}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--orange-2);font-weight:700;margin-bottom:8px}
.panel.warn{border-color:var(--orange);background:#FFF8F2}
.panel p{margin:10px 0;color:var(--muted);font-size:14.5px;line-height:1.65}
.panel p strong,.panel li strong{color:var(--ink)}
.panel code{font-size:12.5px;background:var(--paper);padding:1px 6px;border-radius:4px}
.steps{margin:12px 0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.65}
.steps li{margin:10px 0}
.rowbtn{width:100%;cursor:pointer;font:inherit;text-align:left;color:inherit}
.rowbtn:hover{border-color:var(--ink)}
.muted{color:var(--muted);font-size:12px}
.relato{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff}
.relato header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.relato header span{color:var(--muted);font-size:13px;margin-right:auto}
.relato p{white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.lv-top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;background:var(--ink);color:#fff;
}
.lv-top a{color:#fff;font-size:13px;text-decoration:none;opacity:.85}
.lv-top a:hover{opacity:1}
textarea.inp{min-height:180px;resize:vertical}
</style>
</head>
<body>
<header class="lv-top">
  <strong>Livro da Vida · caderno local</strong>
  <a href="dashboard.html">← Desk</a>
</header>
<main class="wrap-lv">
  <div id="app"></div>
</main>
<script src="assets/livro-da-vida.js"></script>
</body>
</html>
