<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard do extrato 2026 — Priscila Palomo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Dashboard pessoal do extrato de 2026: entradas e saídas de cada mês.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>P</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<style>
.ex-page {
  background: #070012;
  color: #F4FFE8;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.4;
}
.ex-wrap { width: min(880px, 92vw); margin-inline: auto; }
.ex-page nav {
  background: #070012;
  border-bottom: 1px solid #2A1840;
  height: auto;
  min-height: 56px;
}
.ex-page .nav-logo-name { color: #F4FFE8; font-size: 16px; }
.ex-page .nav-logo-sub { display: none; }
.ex-page .nav-links a { color: #9AA89A; font-size: 15px; }
.ex-page .nav-links a:hover { color: #F4FFE8; }
.ex-hero { padding: 28px 0 8px; }
.ex-hero h1 { color: #F4FFE8; font-size: 28px; font-weight: 700; line-height: 1.2; }
.ex-hero p { margin-top: 6px; color: #9AA89A; font-size: 15px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 22px 0 8px; }
.kpi span { display: block; color: #9AA89A; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.kpi strong { display: block; margin-top: 4px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi.ent strong { color: #39FF14; }
.kpi.sai strong { color: #FF2BD6; }
.kpi.res strong { color: #F4FFE8; }
.ex-sec { padding: 28px 0; }
.ex-sec h2 { color: #F4FFE8; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.chart svg { display: block; width: 100%; height: auto; background: transparent; min-width: 640px; }
.chart { overflow-x: auto; }
.ex-page svg text { font-family: Arial, Helvetica, sans-serif; fill: #C9D4C4; font-size: 13px; }
.legend { display: flex; gap: 16px; margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
.legend span { color: #C9D4C4; font-size: 14px; }
.sheet-wrap { overflow-x: auto; }
table.sheet { width: 100%; border-collapse: collapse; min-width: 520px; }
.sheet th {
  text-align: left; color: #9AA89A; font-size: 13px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; padding: 8px 6px;
  border-bottom: 1px solid #2A1840;
}
.sheet td { padding: 8px 6px; border-bottom: 1px solid #1C1028; color: #F4FFE8; font-size: 16px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pos { color: #39FF14; }
.neg { color: #FF2BD6; }
.sheet tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid #F4FFE8; }
.ex-page footer { background: #070012; border-top: 1px solid #2A1840; }
.ex-page .foot-links a, .ex-page .foot-info { color: #9AA89A; font-size: 14px; }
@media (max-width: 700px) {
  .kpis { grid-template-columns: 1fr; }
  .kpi strong { font-size: 22px; }
}
</style>
</head>
<body class="ex-page">

<nav>
  <a class="nav-logo" href="dashboard.html">
    <img src="assets/logo.svg" alt="Priscila Palomo Psicologia">
    <div class="nav-logo-text">
      <span class="nav-logo-name">Priscila Palomo</span>
      <span class="nav-logo-sub">Dashboard · uso pessoal</span>
    </div>
  </a>
  <button class="nav-toggle" onclick="toggleMenu()" aria-label="Menu">☰</button>
  <ul class="nav-links">
    <li><a href="dashboard.html">Desk</a></li>
  </ul>
</nav>

<main class="ex-wrap">
  <header class="ex-hero">
    <h1>Entradas e saídas</h1>
    <p>1 jan – 25 set 2026</p>
  </header>

  <section class="kpis" aria-label="Totais do ano">
    <article class="kpi ent"><span>Entrou</span><strong id="kpi-entradas">—</strong></article>
    <article class="kpi sai"><span>Saiu</span><strong id="kpi-saidas">—</strong></article>
    <article class="kpi res"><span>Resultado</span><strong id="kpi-resultado">—</strong></article>
  </section>

  <section class="ex-sec" id="totais">
    <h2>Por mês</h2>
    <div class="chart" id="chart-totais"></div>
    <div class="legend" id="legenda-totais"></div>
  </section>

  <section class="ex-sec" id="resumo">
    <div class="sheet-wrap" id="tabela-mes"></div>
  </section>
</main>

<footer>
  <a href="dashboard.html" class="foot-logo"><img src="assets/logo.svg" alt=""></a>
  <div class="foot-links">
    <a href="dashboard.html">Desk</a>
  </div>
  <span class="foot-info">1 jan – 25 set 2026</span>
</footer>

<script src="assets/app.js"></script>
<script src="assets/extrato-2026.data.js"></script>
<script src="assets/extrato-2026.js"></script>
</body>
</html>
